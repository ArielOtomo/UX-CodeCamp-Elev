<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UX-CodeCamp – Praktiska övningar</title>
  <meta name="description" content="Kodrutor att prova själv under genomgången – UX-CodeCamp, HTML och CSS för UX-designers.">

  <!-- Typsnitt från Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Josefin+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- All design ligger i den här filen. Kolla högst upp: där finns sidans "designtokens" (variabler). -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="images/brand-mark.svg" type="image/svg+xml">
</head>
<body>
  <a class="skip-link" href="#innehall">Hoppa till innehållet</a>

  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Dölj sidomenyn" title="Dölj sidomenyn" aria-expanded="true" aria-controls="sidebar">
      <!-- Panel-ikon: pil åt vänster = fäll ihop menyn -->
      <svg class="i-panel-close" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/><path d="m16 9-3 3 3 3"/></svg>
      <!-- Panel-ikon: pil åt höger = fäll ut menyn -->
      <svg class="i-panel-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/><path d="m13 9 3 3-3 3"/></svg>
    </button>

    <a href="#/" class="brand">
      <img class="brand-mark" src="images/brand-mark.svg" alt="" width="32" height="32">
      <span>UX-CodeCamp</span>
      <span class="chip brand-tag">Prova själv</span>
    </a>

    <nav class="topnav" aria-label="Huvudmeny">
      <a href="#/">Kurs</a>
      <a href="#/bibliotek">Bibliotek</a>
    </nav>

    <div class="search">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="searchInput" placeholder="Sök kodrutor… t.ex. padding, flex, länk" autocomplete="off" aria-label="Sök i kursen">
      <kbd class="search-kbd" aria-hidden="true">/</kbd>
      <div class="search-results" id="searchResults" role="listbox" hidden></div>
    </div>

    <button class="icon-btn" id="themeBtn" aria-label="Byt mellan ljust och mörkt läge">
      <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Kursens kapitel">
      <div id="toc"></div>
    </nav>

    <div class="scrim" id="scrim" hidden></div>

    <main id="innehall" class="content" tabindex="-1">
      <!-- Innehållet ritas ut av js/app.js utifrån js/content.js -->
    </main>
  </div>

  <!-- Kursens kodrutor -->
  <div class="full-backdrop" aria-hidden="true"></div>

  <script src="js/content-kurs.js"></script>
  <script src="js/content-library.js"></script>
  <!-- Logiken som ritar ut allt -->
  <script src="js/app.js"></script>
</body>
</html>
